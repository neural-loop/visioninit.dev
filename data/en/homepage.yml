# ./data/en/homepage.yml

slider:
  enable: true
  slider_item:
    - title: "Secure Development by Design"
      content: "Building robust, scalable web solutions with security embedded from inception. Leveraging **20+ years of full-stack expertise** and proven security credentials to protect your digital assets and accelerate innovation."
      button:
        enable: true
        label: "Schedule Consultation"
        link: "schedule"
        style: "btn-primary"
      button2:
        enable: true
        label: "Explore Services"
        link: "/services/"
        style: "btn-outline-primary text-white border-white"

banner_feature:
  enable: true
  feature_item:
    - name: "Secure Development Services" # Aligned with Service Category 1
      icon: "fa-solid fa-shield-halved" # Security icon
      content: "Architecting and building applications where security is a foundational element, minimizing risks and future costs."
    - name: "Ethical Hacking & Assessments" # Aligned with Service Category 2
      icon: "fa-solid fa-user-secret" # Hacker/Assessment icon
      content: "Developer-led security testing providing practical, actionable remediation guidance your team can implement."
    - name: "Full-Stack & Cloud Expertise" # Highlighting key strength
      icon: "fa-solid fa-layer-group" # Stack/Layers icon
      content: "Comprehensive solutions across frontend, backend, APIs, and cloud platforms (AWS, Google Cloud)."
    - name: "Security Transformation" # Aligned with Service Category 3
      icon: "fa-solid fa-arrows-rotate" # Transformation/Process icon
      content: "Integrating security seamlessly into your development lifecycle (DevSecOps) and empowering your teams."

how_it_works:
  enable: true
  title: "Our Collaborative Approach" # Changed title
  steps:
    - title: "1. Discovery & Strategy"
      icon: "fa-solid fa-comments" # Communication/Understanding icon
      description: "We start by thoroughly understanding your goals, technical landscape, and security requirements to define a clear path forward."
      link_label: "Start the Conversation" # Link to contact
      link: "schedule" # Use param shortcode hint (actual link in template)    - title: "2. Solution Design & Secure Build"
      icon: "fa-solid fa-file-code" # Code/Blueprint icon
      description: "Architecting and developing your solution with security principles embedded throughout the process, using best practices and appropriate technologies."
      link_label: "View Our Services" # Link to services
      link: "/services/"
    - title: "2. Rigorous Testing & Refinement"
      icon: "fa-solid fa-vial-circle-check" # Testing/Validation icon
      description: "Comprehensive testing, including security assessments and code reviews, ensures quality, resilience, and adherence to requirements."
      # link_label: "Learn About Assessments" # Optional link to specific service
      # link: "/services/security-assessment/"
    - title: "3. Deployment & Partnership"
      icon: "fa-solid fa-rocket" # Launch/Support icon
      description: "Managing deployment and offering ongoing support or knowledge transfer to ensure your solution delivers long-term value."
      # link_label: "Discuss Ongoing Support" # Optional link to contact
      # link: "/contact/"
