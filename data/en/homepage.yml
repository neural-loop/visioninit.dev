# ./data/en/homepage.yml

slider:
  enable: true
  # bg_image: "images/banner.jpg" # <<< REMOVE or COMMENT OUT this line
  slider_item:
    - title: "Secure Development by Design"
      content: "Building robust, scalable web solutions with security embedded from inception. Leveraging **20+ years of full-stack expertise** and proven security credentials to protect your digital assets and accelerate innovation."
      button:
        enable: true
        label: "Schedule Consultation"
        link: "schedule"
        style: "btn-primary"
      button2:
        enable: true
        label: "Explore Services"
        link: "#core-services"
        style: "btn-outline-primary text-white border-white"

subscription_tiers:
  enable: true
  title: "Security Sidekick Plans" # Title for the section on the homepage
  subtitle: "Choose the level of ongoing security support that fits your needs." # Subtitle
  tiers:
    - name: "Sure Shot"
      price: "$500"
      price_suffix: "one-time" # Suffix describes the payment
      description: "Perfect for addressing a single, specific security question or review. Get expert eyes on one critical item." # Short description for homepage card
      # Optional: Add 1-2 key highlights if desired using 'features:' list like before
      # features:
      #   - icon: "fa-solid fa-bullseye"
      #     text: "One dedicated security request."
      button:
        label: "Learn More"
        link: "/security-sidekick/" # Links to the main page for now

    - name: "Steady Shot"
      price: "$4995"
      price_suffix: "/month"
      description: "Comprehensive ongoing security guidance. Unlimited requests (one active), code reviews, vulnerability advice, and proactive support."
      # Optional: Add 1-2 key highlights
      # features:
      #   - icon: "fa-solid fa-shield-heart"
      #     text: "Unlimited requests (one active)."
      #   - icon: "fa-solid fa-clock-rotate-left"
      #     text: "Typical 48-72hr turnaround."
      button:
        label: "Learn More"
        link: "/security-sidekick/" # Links to the main page for now

