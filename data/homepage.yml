      price: '$500'
      price_suffix: 'one-time' # Suffix describes the payment
      description: 'Perfect for addressing a single, specific security question or review. Get expert eyes on one critical item.' # Short description for homepage card
      # Optional: Add 1-2 key highlights if desired using 'features:' list like before
      # features:
      #   - icon: "fa-solid fa-bullseye"
      #     text: "One dedicated security request."
      button:
        label: 'Learn about Sure Shot'
        link: '/security-sidekick/' # Links to the main page for now

    - name: 'Steady Shot'
      price: '$4995'
      price_suffix: '/month'
      description: 'Comprehensive ongoing security guidance. Unlimited requests (one active), code reviews, vulnerability advice, and proactive support.'
      # Optional: Add 1-2 key highlights
      # features:
      #   - icon: "fa-solid fa-shield-heart"
      #     text: "Unlimited requests (one active)."
      #   - icon: "fa-solid fa-clock-rotate-left"
      #     text: "Typical 48-72hr turnaround."
      button:
        label: 'Learn about Steady Shot'
        link: '/security-sidekick/' # Links to the main page for now

