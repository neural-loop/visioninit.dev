      button2:
        enable: true
        label: 'Explore Services'
        link: '#core-services'
        style: 'btn-outline-primary'

philosophy_section:
  enable: true
  title: "Justin's Approach & Philosophy"
  content: |
    Justin Riddiough's core philosophy centers on leveraging technology not just to solve problems, but to elevate a client's entire digital presence and communication strategy. In a landscape rapidly reshaped by AI and evolving security threats, he believes in a proactive, integrated approach. This means building secure, resilient systems from the ground up and strategically incorporating advancements like AI—often inspired by and contributing back to open-source innovation—to create more effective, engaging, and intelligent digital experiences.
  
    Justin partners with clients to understand their unique needs, then applies two decades of technical expertise to craft solutions that are both innovative and pragmatic. His goal is to ensure technology serves as a powerful enabler for clear communication, efficient operations, and sustained growth in the digital age.

