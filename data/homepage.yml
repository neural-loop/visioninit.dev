# ./data/en/homepage.yml

slider:
  enable: true
  slider_item:
    - title: "Your Expert in Digital Strategy & Technical Solutions"
      content: 'With over 20+ years of full-stack expertise, I embed security from inception to protect your digital assets and accelerate your innovation.'
      button:
        enable: true
        label: 'Schedule Consultation with Justin'
        link: 'schedule'
        style: 'btn-primary'
      button2:
        enable: true
        label: 'Explore Services'
        link: '#core-services'
        style: 'btn-outline-primary'

subscription_tiers:
  enable: true
  title: 'Security Sidekick Plans'
  subtitle: 'Choose the level of ongoing security support that fits your needs.'
  tiers:
