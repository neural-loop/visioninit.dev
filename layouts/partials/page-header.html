<!-- layouts/partials/page-header.html -->
<!-- Page title section without breadcrumbs -->
<section class="page-title-section overlay">
  <div class="container">
    <div class="row align-items-center">
      <!-- Left Column - Title (Now H1) and Description -->
      <div class="col-lg-8 col-md-7">
        {{/* Title is now the main H1 for the page */}}
        <h1 class="text-white font-secondary mb-3 h2">{{ .Title }}</h1>
        {{/* Page Description remains */}}
        <p class="text-lighten">{{ .Params.Description | markdownify }}</p>
      </div>

      <!-- Right Column - OG Image Preview Partial -->
      <div class="col-lg-4 col-md-5 mt-md-0 mt-4">
        {{ partial "og-preview.html" . }}
      </div>
    </div>
  </div>
</section>
